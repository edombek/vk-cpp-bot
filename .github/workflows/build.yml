name: Build

# CI возвращена 2026-10-23. Причина прошлой приостановки — apt-установка OpenCV
# подвешивалась на скачивании пакетов; теперь архивы apt кэшируются, установка идёт
# без recommended-зависимостей с ретраями, а у джоба есть timeout (зависаний нет).
on:
  push:
    branches: [ "master", "ai-optimization" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # OpenCV — самая тяжёлая зависимость: держим скачанные .deb в actions/cache
      - name: Cache apt packages (OpenCV)
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      # pybind11 из apt (2.11) без py::subinterpreter — нужен актуальный pip-пакет;
      # CMake подхватит его через fallback (`python3 -m pybind11 --includes`)
      - name: Install dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            cmake libcurl4-openssl-dev libopencv-dev python3-dev
          python3 -m pip install --break-system-packages --quiet pybind11

      - name: Configure (with Python)
        run: cmake -S . -B build -DVKBOT_WITH_PYTHON=ON

      - name: Build (with Python)
        run: cmake --build build -j

      - name: Tests (with Python)
        run: ctest --test-dir build --output-on-failure

      - name: Configure (without Python)
        run: cmake -S . -B build-nopy -DVKBOT_WITH_PYTHON=OFF

      - name: Build (without Python)
        run: cmake --build build-nopy -j

      - name: Tests (without Python)
        run: ctest --test-dir build-nopy --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: vkbot-linux
          path: |
            build/vkbot
            build-nopy/vkbot
